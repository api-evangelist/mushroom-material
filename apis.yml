name: Mushroom Material
description: >-
  Mushroom Material is a New Zealand and Singapore based sustainable-packaging
  startup founded in 2020 by Shaun Seaman and Jotinder Singh that grows a
  biodegradable, home-compostable alternative to expanded polystyrene (Styrofoam)
  from fungal mycelium. The company combines agricultural byproducts such as wood
  chips, sawdust, hemp straw and cardboard with mycelium to grow millions of
  pellets, coats them in a biopolymer binder, and uses compression molding to
  shape protective packaging that drops into existing Styrofoam production lines.
  The material offers shock absorption, low density and natural water resistance
  while composting in months. A Techstars-backed company, Mushroom Material raised
  a US$5M+ (NZ$8.5M) seed round led by Wavemaker Partners and Singapore's SEEDS
  Capital (with Icehouse Ventures, K1W1 and Black Kite Capital) to build a pilot
  plant in Auckland. This profile is a materials/manufacturing company in the API
  Evangelist network; it has no public API surface.
